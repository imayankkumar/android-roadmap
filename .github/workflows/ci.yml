name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and run every test
        run: ./gradlew build

      - name: Regenerate decompiled Java
        run: ./gradlew decompile

      - name: Check decompiled Java is up to date
        run: |
          if [ -n "$(git status --porcelain -- topics)" ]; then
            git status --short -- topics
            git diff -- topics
            echo "::error::decompiled/ is out of date. Run ./gradlew decompile and commit the result."
            exit 1
          fi
